[/Script/UnrealEd.ProjectPackagingSettings]
bUseZenStore=False
; Content/Data holds the JSON tuning files (spells, weapons, enemies...). They ship as loose
; files so numbers can be tuned in a packaged build without repackaging.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
; Placeholders are built in C++ from the engine's basic shapes; make sure they are cooked.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")
+DirectoriesToAlwaysCook=(Path="/Engine/EngineMaterials")
; Our own materials are loaded by path from C++ (GBPlaceholder), so nothing references them for the cook.
+DirectoriesToAlwaysCook=(Path="/Game/Glyphbound/Materials")
; The pistol viewmodel meshes are loaded by path from C++ (AGBGun), so nothing references them for the cook.
+DirectoriesToAlwaysCook=(Path="/Game/Glyphbound/Weapons")
; The Entity's meshes and materials are loaded by path from C++ (AGBEntity), so nothing references them for the cook.
; Without this line the packaged boss fell back to its placeholder look (found by the packaged smoke run, 2026-11-13).
+DirectoriesToAlwaysCook=(Path="/Game/Glyphbound/Enemies")
; The 3D enemies of the future (skeletal meshes, clips, weapon, drone and sentinel parts) and the Niagara systems of their shots are loaded by path from C++ (AGBSkeletalEnemy, AGBDroneEnemy, AGBSentinelEnemy).
+DirectoriesToAlwaysCook=(Path="/Game/Glyphbound/Characters")
+DirectoriesToAlwaysCook=(Path="/Game/MuzzleFlash3D/FX")
+DirectoriesToAlwaysCook=(Path="/Game/SciFi_Impacts/FX")
+DirectoriesToAlwaysCook=(Path="/Game/GunFX/NiagaraSystem/ImpactFX/Concrete")
; The logo (title screen, end credits) is loaded by path from C++ (GBLogo).
+DirectoriesToAlwaysCook=(Path="/Game/Glyphbound/UI")
; The tunnel smoke (AGBFluidFog loads FluidFog.System from Game.json) and the drone/sentinel death sparks (Enemies.json Fx.DeathSparks) are loaded by path.
+DirectoriesToAlwaysCook=(Path="/Game/Glyphbound/FX")
+DirectoriesToAlwaysCook=(Path="/Game/GunFX/NiagaraSystem/ImpactFX/Electric")
+MapsToCook=(FilePath="/Engine/Maps/Entry")
+MapsToCook=(FilePath="/Game/Glyphbound/Maps/FutureBase")
+MapsToCook=(FilePath="/Game/Glyphbound/Maps/PastCastle")
+MapsToCook=(FilePath="/Game/Glyphbound/Maps/EntityArena")
; The final boss empowers its scythe with the Slash Trail FX Elemental pack's Nature systems, loaded by path from Enemies.json.
+DirectoriesToAlwaysCook=(Path="/Game/SlashTrail_SoftTofu/Niagara/Nature")
