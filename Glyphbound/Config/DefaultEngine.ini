[/Script/NavigationSystem.RecastNavMesh]
; The test arena is spawned at runtime (no map asset, no saved navmesh) and its era-only walls switch collision
; on era travel, so the navmesh is generated and updated while playing. A navmesh placed in a real map can still
; be set back to Static in its own details panel.
RuntimeGeneration=Dynamic

[/Script/Engine.LocalPlayer]
; Vertical FOV is the fixed axis (was the engine default MaintainXFOV): the FieldOfView value is the vertical
; one, so every FOV was converted for 16:9 to look exactly as before (hip 90 -> 58.72). The first-person gun
; is rendered with the fixed ViewModelFOV (Game.json) and no longer moves when aiming changes the world FOV.
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV

[ConsoleVariables]
; UE 5.9 computes Maintain-Y projection from the FOV value with the new path by default; the legacy matrix treats
; the FOV value itself as the vertical FOV (the assumption every converted FOV above relies on). Checked in
; Engine/Source/Runtime/Engine/Private/Camera/CameraStackTypes.cpp (r.UseLegacyMaintainYFOVViewMatrix).
r.UseLegacyMaintainYFOVViewMatrix=1

